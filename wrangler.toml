# Configuration Cloudflare (projet Workers avec ressources statiques).
# Le nom doit correspondre au service créé dans le tableau de bord Cloudflare.
# Dans les réglages du projet, la commande de build doit être : npm run build
name = "site-internet-amaafe"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
